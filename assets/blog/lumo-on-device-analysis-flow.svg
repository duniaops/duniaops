<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">Lumo photo analysis stays on the device</title>
<desc id="desc">Selected photographs pass through on-device image classification and text recognition to a local search index. This diagram covers photo analysis only. Optional service connections are separate.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111e35"/><stop offset="1" stop-color="#080f1e"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#447cfa"/><stop offset="1" stop-color="#244cca"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#91b3ff" stroke-width="1.7"/></marker></defs>
<rect width="720" height="760" rx="24" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
<text x="48" y="66" fill="#a8c0ff" font-size="22" letter-spacing="3">LUMO · PROCESSING BOUNDARY</text>
<text x="48" y="116" fill="#ffffff" font-size="32" font-weight="700">Photo analysis, on your device</text>
<rect x="44" y="153" width="632" height="557" rx="24" fill="#101a2d" stroke="#5277c8" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="76" y="184" width="568" height="126" rx="17" fill="#182843" stroke="#36598e"/>
<circle cx="121" cy="228" r="20" fill="url(#blue)"/><text x="121" y="236" text-anchor="middle" fill="white" font-size="24" font-weight="700">1</text>
<text x="162" y="236" fill="white" font-size="30" font-weight="700">Selected photographs</text>
<text x="162" y="277" fill="#c3d1eb" font-size="25">Input for analysis</text>
<path d="M360 318v38" stroke="#91b3ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="370" width="568" height="126" rx="17" fill="#192e53" stroke="#6196ff" stroke-width="2"/>
<circle cx="121" cy="414" r="20" fill="url(#blue)"/><text x="121" y="422" text-anchor="middle" fill="white" font-size="24" font-weight="700">2</text>
<text x="162" y="422" fill="white" font-size="30" font-weight="700">On-device analysis</text>
<text x="162" y="463" fill="#c3d1eb" font-size="25">Image labels and visible text</text>
<path d="M360 504v38" stroke="#91b3ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="556" width="568" height="126" rx="17" fill="#182843" stroke="#36598e"/>
<circle cx="121" cy="600" r="20" fill="url(#blue)"/><text x="121" y="608" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text>
<text x="162" y="608" fill="white" font-size="30" font-weight="700">Local search index</text>
<text x="162" y="649" fill="#c3d1eb" font-size="25">Find prepared photographs</text>
</g></svg>
