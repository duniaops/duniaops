<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
<title id="title">Lumo keeps the user in control of removal</title>
<desc id="desc">Compare photographs, choose the keepers, review proposed removals and explicitly confirm removal. Reviewing a suggestion does not itself authorise removal. The diagram is a simplified explanation, not an app screenshot.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111e35"/><stop offset="1" stop-color="#080f1e"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#447cfa"/><stop offset="1" stop-color="#244cca"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#91b3ff" stroke-width="1.7"/></marker></defs>
<rect width="720" height="820" rx="24" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
<text x="48" y="66" fill="#a8c0ff" font-size="22" letter-spacing="3">LUMO · USER CONTROL</text>
<text x="48" y="116" fill="white" font-size="32" font-weight="700">From recommendation to decision</text>
<rect x="76" y="158" width="568" height="116" rx="17" fill="#182843" stroke="#36598e"/>
<circle cx="121" cy="202" r="20" fill="url(#blue)"/><text x="121" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="700">1</text>
<text x="162" y="210" fill="white" font-size="30" font-weight="700">Compare photographs</text>
<text x="162" y="249" fill="#c3d1eb" font-size="25">Use the recommendation as a guide</text>
<path d="M360 282v31" stroke="#91b3ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="328" width="568" height="116" rx="17" fill="#182843" stroke="#36598e"/>
<circle cx="121" cy="372" r="20" fill="url(#blue)"/><text x="121" y="380" text-anchor="middle" fill="white" font-size="24" font-weight="700">2</text>
<text x="162" y="380" fill="white" font-size="30" font-weight="700">Choose keepers</text>
<text x="162" y="419" fill="#c3d1eb" font-size="25">Keep one or several</text>
<path d="M360 452v31" stroke="#91b3ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="498" width="568" height="116" rx="17" fill="#182843" stroke="#36598e"/>
<circle cx="121" cy="542" r="20" fill="url(#blue)"/><text x="121" y="550" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text>
<text x="162" y="550" fill="white" font-size="30" font-weight="700">Review removals</text>
<text x="162" y="589" fill="#c3d1eb" font-size="25">Check what would be removed</text>
<path d="M360 622v31" stroke="#91b3ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="76" y="668" width="568" height="116" rx="17" fill="#192e53" stroke="#6196ff" stroke-width="2"/>
<circle cx="121" cy="712" r="20" fill="url(#blue)"/><text x="121" y="720" text-anchor="middle" fill="white" font-size="24" font-weight="700">4</text>
<text x="162" y="720" fill="white" font-size="30" font-weight="700">Confirm removal</text>
<text x="162" y="759" fill="#c3d1eb" font-size="25">Explicit approval before deletion</text>
</g></svg>
