# Rebuilds the site once a day so the Rockimals "today" page shows the new UTC
# day's visitors (website spec 036). It only calls a Netlify build hook; the
# build itself reads NASA NeoWs with the NASA_API_KEY set in Netlify.
#
# Owner setup: create a build hook for `main` in Netlify (Site configuration →
# Build & deploy → Build hooks) and store its URL as the repository secret
# NETLIFY_ROCKIMALS_TODAY_BUILD_HOOK. Without the secret the job does nothing.
name: Rockimals today page

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Netlify build hook
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_ROCKIMALS_TODAY_BUILD_HOOK }}
        run: |
          if [ -z "$BUILD_HOOK" ]; then
            echo "NETLIFY_ROCKIMALS_TODAY_BUILD_HOOK is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST -d '{}' "$BUILD_HOOK?trigger_title=rockimals-today"
