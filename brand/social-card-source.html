<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DuniaOps social card source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{font-family:Inter,system-ui,sans-serif;background:#070d17;color:#fff}.card{position:relative;width:1200px;height:630px;padding:72px 82px;display:flex;flex-direction:column;background:radial-gradient(780px 430px at 7% -18%,rgba(43,157,224,.34),transparent 66%),radial-gradient(680px 380px at 96% 0,rgba(226,100,92,.28),transparent 65%),#070d17}.grid{position:absolute;inset:0;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 78%)}.top,.content,.bottom{position:relative}.top{display:flex;align-items:center;justify-content:space-between}.logo-plate{display:inline-flex;background:#fff;border-radius:16px;padding:12px 18px}.logo-plate img{display:block;width:auto;height:66px}.eyebrow{font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9fd0f2}.content{margin-top:auto;margin-bottom:auto;max-width:980px}.content h1{margin:0;font-size:68px;line-height:1.04;letter-spacing:-.045em;font-weight:800}.gradient{background:linear-gradient(90deg,#2b9de0 0%,#7b6bb0 52%,#e2645c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.content p{margin:26px 0 0;max-width:850px;color:#b7c0ce;font-size:25px;line-height:1.45;font-weight:500}.bottom{display:flex;align-items:center;justify-content:space-between;color:#dfe6ef;font-size:17px;font-weight:600}.domain{color:#fff}.accent{width:92px;height:4px;border-radius:4px;background:linear-gradient(90deg,#2b9de0,#e2645c)}
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="top"><span class="logo-plate"><img src="../assets/logo-lockup.png" alt="DuniaOps"></span><span class="eyebrow">Software &amp; DevOps consultancy · London</span></div>
    <div class="content"><h1>Enterprise-grade software,<br><span class="gradient">delivered at startup speed.</span></h1><p>Senior engineers, AI-accelerated delivery and full-cycle ownership — from first prototype to production.</p></div>
    <div class="bottom"><span class="accent"></span><span class="domain">www.duniaops.com</span></div>
  </div>
</body>
</html>
